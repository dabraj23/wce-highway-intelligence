<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>AYS Obligations Command</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500&display=swap">
<style>
/* Layout: white workspace in the AYS brand. Sticky top bar with the AYS logo and gold-red stripe, left nav, 12-col panels. Blue for interaction; semantic good/warn/crit separate; brand red/gold only in the logo and stripe. */
:root{
  color-scheme:light;
  --bg:#ffffff; --panel:#ffffff; --panel-2:#f5f6f8; --raise:#eceff3; --line:#e2e6ec; --line-2:#eef0f4;
  --ink:#141a22; --muted:#5b6573; --faint:#8a93a0; --pri:#1f2a37;
  --accent:#2f6fd0; --accent-dim:rgba(47,111,208,.09);
  --brand-red:#d7261e; --brand-gold:#e2b021;
  --good:#1f9d55; --warn:#c77700; --warn-ink:#9a5b00; --crit:#d32f2f; --mng:#0f9488; --watch:#b58900;
  --f:"IBM Plex Sans",Arial,"Helvetica Neue",sans-serif; --m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:13.5px;line-height:1.45;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#fff}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.lbl{font-size:12px;color:var(--muted)}
.nowrap{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);border-top:3px solid var(--brand-gold);box-shadow:inset 0 3px 0 -0px transparent;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap;min-width:0}
.logo img{height:28px;width:auto;display:block}.logo .div{width:1px;height:24px;background:var(--line)}
.logo b{font-weight:600;font-size:13.5px}.logo span{color:var(--muted);font-size:12.5px}
.right{margin-left:auto;display:flex;align-items:center;gap:10px}
.ask-in{position:relative}
.ask-in input{width:300px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:13px;padding:7px 10px 7px 30px}
.ask-in input::placeholder{color:var(--faint)}
.ask-in svg{position:absolute;left:10px;top:9px;color:var(--faint)}
.demo-pill{font-size:11.5px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:99px;padding:3px 10px;white-space:nowrap;cursor:pointer}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}.syncdot.live{background:var(--good);box-shadow:0 0 0 3px rgba(47,191,113,.18)}.syncdot.local{background:var(--warn)}

/* shell */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);align-items:start}
.side{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);background:#fbfbfc;padding:12px 10px;padding-left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:18px 11px 8px}
.nv{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--muted);padding:8px 11px;border-radius:9px;font-size:13.5px;text-align:left;position:relative;white-space:nowrap}
.nv svg{flex:none;width:18px;height:18px}
.nv:hover{background:var(--panel);color:var(--ink)}
.nv[aria-current="page"]{background:var(--accent-dim);color:var(--ink)}
.nv[aria-current="page"] svg{color:var(--accent)}
.nv[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand-red)}
.nv .bd{margin-left:auto;font-family:var(--m);font-size:11px;padding:1px 7px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.nv .bd:empty{display:none}.nv .bd.crit{color:var(--crit);background:rgba(239,83,80,.13)}.nv .bd.warn{color:var(--warn);background:rgba(250,178,25,.12)}
.side-foot{margin-top:auto;padding:12px 11px 4px;font-size:11.5px;color:var(--faint);line-height:1.5}
.page{min-width:0;max-width:1480px;width:100%;margin:0 auto;padding-block:20px 90px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:22px;letter-spacing:-.01em}.ph .sub{color:var(--muted);font-size:13px;margin-top:3px;max-width:80ch}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.p{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0;position:relative;box-shadow:var(--shadow)}
.p-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.p-h h2{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.p-h .meta{font-size:12px;color:var(--faint)}
.p-b{padding:12px 16px 16px}
.src{font-size:10.5px;color:var(--faint);margin-left:4px;cursor:help}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}

/* stats */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;min-width:0;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.stat .v{font-size:26px;font-weight:300;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px;white-space:nowrap}
.stat .v small{font-size:14px;color:var(--muted);margin-left:2px}
.stat .d{font-size:12px;color:var(--muted)}
.meter{height:6px;background:var(--line);border-radius:3px;position:relative;margin:8px 0 4px;overflow:hidden}.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}

/* controls */
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:#c9ced6;background:var(--raise)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:500}.btn.pri:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:14px;height:14px}
select.btn{padding-right:8px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:6px;padding:5px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lnk{background:none;border:0;padding:0;color:var(--accent)}.lnk:hover{text-decoration:underline}
.pill{display:inline-block;font-size:11px;font-family:var(--m);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.pill.ai{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.st{white-space:nowrap;font-size:12.5px}
.st.bad{color:var(--crit)}.st.warn{color:var(--warn)}.st.ok{color:var(--good)}.st.mut{color:var(--muted)}.st.info{color:var(--accent)}.st.mng{color:var(--mng)}
.sec-t{font-size:11px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;padding:14px 0 8px}
.fr-empty{padding:18px 16px;color:var(--muted)}
.ci{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 32%,transparent)}
.ci svg{width:15px;height:15px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--panel-2)}
.tbl .r{text-align:right;font-family:var(--m);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll-x{overflow-x:auto}
.bar{height:7px;border-radius:4px;background:var(--line);position:relative;overflow:hidden;min-width:60px}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}

/* breadcrumb + venture tiles */
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;margin-bottom:12px}
.crumbs button{background:none;border:0;color:var(--accent);padding:2px 0}.crumbs button:hover{text-decoration:underline}
.crumbs span.sep{color:var(--faint)}.crumbs b{font-weight:500}
.vtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:12px}
.vt{display:flex;flex-direction:column;gap:9px;text-align:left;padding:15px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 11%,var(--panel)),var(--panel) 62%);color:var(--ink);transition:transform .15s,border-color .15s;min-width:0}
.vt:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.vt.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.vt-top{display:flex;gap:11px;align-items:center}.vt-top b{font-weight:600;font-size:15px}.vt-top .lbl{display:block}
.vt-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent);flex:none}
.vt-ic svg{width:20px;height:20px}
.vt-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.vt-g>div{display:flex;flex-direction:column;min-width:0}.vt-g b{font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.vt-nx{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chips .bad{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}.chips .warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}.chips .okc{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}.chips .ai{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}.chips .mngc{color:var(--mng);border-color:color-mix(in srgb,var(--mng) 45%,var(--line))}
.vhead{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.vh-card{padding:16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--c) 10%,var(--panel)),var(--panel) 70%)}
.vh-card h2{font-size:20px;margin:2px 0 4px}
.ents{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.ents span{font-size:12px;padding:3px 9px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13px}.kv span{color:var(--muted)}.kv b{font-weight:400;text-align:right;font-variant-numeric:tabular-nums}

/* smart file cards (from WCE) */
.sf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.sf-card{display:flex;gap:12px;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:transform .15s,border-color .15s;position:relative;overflow:hidden;min-width:0}
.sf-card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c)}
.sf-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.sf-ic{width:44px;height:52px;flex:none;border-radius:6px 14px 6px 6px;display:grid;place-items:center;color:var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 28%,transparent),color-mix(in srgb,var(--c) 8%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.sf-ic svg{width:22px;height:22px}.sf-ic.lg{width:58px;height:68px}.sf-ic.lg svg{width:28px;height:28px}
.sf-b{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}.sf-b>b{font-weight:600;font-size:14.5px}
.sf-ev{height:4px;border-radius:99px;background:var(--line-2);overflow:hidden}.sf-ev i{display:block;height:100%;background:var(--c)}
.sf-types{display:flex;gap:4px}.sf-types .ci{width:20px;height:20px;border-radius:6px}.sf-types .ci svg{width:12px;height:12px}
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.drawer{margin-top:14px;padding:14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--panel));animation:sfIn .2s ease}
@keyframes sfIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.drawer-h{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.drawer-h>div{display:flex;flex-direction:column}.drawer-h b{font-weight:600}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(20,26,36,.40);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:calc(48px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal-card{position:relative;width:min(1180px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(16,24,40,.22);animation:mpop .22s ease-out;margin-bottom:24px;min-width:0}
.modal-card.mid{width:min(900px,100%)}
@keyframes mpop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:22px;line-height:1;z-index:5}
.modal-bk{padding:12px 60px 0 16px}
.sf-head{display:flex;gap:14px;align-items:center;padding:16px 60px 8px 16px;flex-wrap:wrap}.sf-head h2{font-size:21px;margin:2px 0}.sf-head .tb{margin-left:auto}
.sf-head .id{font-family:var(--m);font-size:12px;color:var(--faint)}
.sf-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:8px 16px}.sf-meta>div{display:flex;flex-direction:column;gap:2px;min-width:0}.sf-meta b{font-weight:500;font-size:13.5px}
.sf-sum{margin:8px 16px;padding:10px 12px;border-radius:10px;background:var(--panel-2);font-size:13.5px;line-height:1.55}
.sf-kpi{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:8px 16px}.sf-kpi>div{display:flex;flex-direction:column;padding:10px;border-radius:10px;border:1px solid var(--line);min-width:0}.sf-kpi b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.sf-cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;padding:4px 16px 16px}
.sf-fil{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.sf-fil button{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px 3px 4px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted)}
.sf-fil button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel-2))}.sf-fil .ci{width:20px;height:20px;border-radius:6px}.sf-fil .ci svg{width:12px;height:12px}.sf-fil button.all{padding-left:9px}
.sf-ob{display:grid;grid-template-columns:30px minmax(0,1fr) auto 112px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-2);padding:9px 4px;color:var(--ink)}
.sf-ob:hover,.sf-ob.on{background:var(--panel-2)}.sf-ob .t{display:flex;flex-direction:column;gap:2px;min-width:0}.sf-ob .st{text-align:right}
.sf-obd{padding:6px 4px 14px 44px}
.sf-tl{display:flex;flex-direction:column;gap:9px}.sf-tl>div{display:grid;grid-template-columns:26px 84px minmax(0,1fr);gap:3px 8px;align-items:baseline}.sf-tl .lbl{grid-column:3}
.sf-tl .ci{width:22px;height:22px;border-radius:6px}.sf-tl .ci svg{width:13px;height:13px}
.st-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--good)}.st-dot.warn{background:var(--warn)}.st-dot.bad{background:var(--crit)}.st-dot.mng{background:var(--mng)}
.sf-terms{list-style:none;margin:0;padding:0;font-size:13.5px;display:flex;flex-direction:column;gap:6px}.sf-terms li{display:flex;gap:8px;align-items:center}.sf-terms .ci{width:22px;height:22px;border-radius:6px}.sf-terms .ci svg{width:13px;height:13px}
.lines{display:flex;flex-direction:column;gap:7px}.line-r{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:4px 10px;font-size:13px;align-items:center}.line-r .bar{grid-column:1/-1}
.clause{border:1px solid var(--line);font-size:13.5px;line-height:1.55;padding:9px 11px;border-radius:8px;background:#f7f6f1;color:#1b1d21;border-left:3px solid #c08a1a}

/* follow-up (from WCE) */
.ldl{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel-2);margin-top:10px}
.ldl-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ldl-h .btn{font-size:12.5px;padding:4px 10px}
.ldl-st{font-size:12.5px;padding:2px 9px;border-radius:99px}.ldl-st.info{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}.ldl-st.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}.ldl-st.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.ldl-form{margin-top:10px;display:flex;flex-direction:column;gap:8px}.ldl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
textarea.ta{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13.5px;resize:vertical}
.ldl-thr{margin-top:10px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line-2);padding-top:10px}
.ldl-m{display:flex;gap:10px;font-size:13.5px}.ldl-m>div{min-width:0}.ldl-m b{font-weight:500}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:600;background:#e3e8ef;color:var(--ink)}.ldl-m.me .av{background:var(--accent);color:#fff}
.ldl-reply{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ldl-reply input,.inp{flex:1;min-width:160px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.obf-plan{margin-top:8px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--good) 7%,transparent);border:1px solid color-mix(in srgb,var(--good) 25%,transparent);font-size:13px;line-height:1.5}

/* risks (from WCE) */
.orx-sum{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px;align-items:stretch}
.orx-k{min-width:84px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column}.orx-k b{font-size:22px;font-weight:500;line-height:1.2}.orx-k span{font-size:12px;color:var(--muted)}
.orx-k.high b{color:var(--crit)}.orx-k.hand b{color:var(--warn)}.orx-k.watch b{color:var(--watch)}.orx-k.mng b{color:var(--mng)}
.orx-ctl{flex:1;min-width:200px;display:flex;flex-direction:column;justify-content:center;gap:6px}.orx-bar{height:8px;border-radius:99px;background:var(--line)}.orx-bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.fil{display:flex;gap:6px;flex-wrap:wrap}.fil button{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted)}.fil button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.orx{border-top:1px solid var(--line-2);border-left:3px solid transparent}.orx.high{border-left-color:var(--crit)}.orx.hand{border-left-color:var(--warn)}.orx.watch{border-left-color:var(--watch)}.orx.mng{border-left-color:var(--mng)}.orx.open{background:color-mix(in srgb,var(--panel-2) 60%,transparent)}
.orx-r{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:76px minmax(0,1fr) 190px 190px 14px;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}.orx-r:hover{background:var(--panel-2)}.orx-r:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.orx-lv{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;justify-self:start}
.orx.high .orx-lv{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}.orx.hand .orx-lv{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}.orx.watch .orx-lv{color:var(--watch);background:color-mix(in srgb,var(--watch) 14%,transparent)}.orx.mng .orx-lv{color:var(--mng);background:color-mix(in srgb,var(--mng) 14%,transparent)}
.orx-t{display:flex;flex-direction:column;min-width:0;gap:2px}.orx-t b{font-weight:500;font-size:14px}
.orx-own{display:flex;gap:8px;align-items:center;min-width:0}.orx-own>span:last-child{display:flex;flex-direction:column;min-width:0}.orx-own b{font-weight:500;font-size:13px}.orx-own .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.orx .av{width:28px;height:28px}
.orx-pl{font-size:12px;padding:2px 9px;border-radius:99px;justify-self:start;white-space:nowrap}.orx-pl.ok{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}.orx-pl.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}.orx-pl.bad{color:var(--crit);background:color-mix(in srgb,var(--crit) 13%,transparent)}.orx-pl.none{color:var(--muted);border:1px dashed var(--line)}
.orx-chev{color:var(--muted);font-size:18px;transition:transform .2s}.orx.open .orx-chev{transform:rotate(90deg)}
.orx-d{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;padding:2px 16px 16px 102px}
.orx-plan{display:flex;flex-direction:column;gap:4px;min-width:0}.orx-txt{font-size:14px;line-height:1.55;margin:2px 0 6px}
.orx-none{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px dashed var(--warn);border-radius:10px}.orx-none b{font-weight:500;color:var(--warn)}
.orx-side{display:flex;flex-direction:column;gap:8px}.orx-oc{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}.orx-oc b{font-weight:500}

/* needs-you / follow-ups lists */
.nrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line-2)}
.nrow:first-child{border-top:0}.nrow .t{display:flex;flex-direction:column;min-width:0;gap:2px}.nrow .t b{font-weight:500}
.nrow .tb .btn{font-size:12px;padding:4px 9px}

/* paper documents */
.doc-bar{position:sticky;top:0;z-index:3;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 56px 12px 16px;background:var(--panel);border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
.doc-t{min-width:0;flex:1}.doc-t b{font-weight:500;font-size:15px}
.paper-wrap{background:#eceff3;padding:22px;display:flex;flex-direction:column;gap:18px;align-items:center;border-radius:0 0 16px 16px}
.paper{position:relative;width:100%;max-width:780px;min-height:980px;background:#fdfdfb;color:#16181c;font-family:Georgia,"Times New Roman",serif;font-size:13.5px;line-height:1.6;padding:56px 64px 64px;box-shadow:0 4px 18px rgba(16,24,40,.14);overflow:hidden}
.paper::before{content:"SAMPLE · ILLUSTRATIVE";position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-32deg);font:600 62px/1 Arial,sans-serif;letter-spacing:.06em;color:rgba(20,30,60,.05);white-space:nowrap;pointer-events:none}
.paper p{margin:0 0 10px}.paper .small{font-size:11.5px;color:#555;font-family:Arial,sans-serif}
.lh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #16181c;padding-bottom:10px;margin-bottom:18px;gap:16px}
.lh-name{font:700 18px/1.2 Arial,sans-serif;letter-spacing:.04em}.lh-sub{font:10.5px/1.4 Arial,sans-serif;color:#555;margin-top:3px}
.lh-mk{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 15px Arial,sans-serif;color:#fff;flex:none}
.ptitle{text-align:center;font:700 15px/1.3 Arial,sans-serif;letter-spacing:.08em;margin:8px 0 16px}
.ptab{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:12.5px;font-family:Arial,sans-serif}
.paper .ptab td{border:1px solid #a6aab0;padding:6px 9px;vertical-align:top}.ptab tr.th td{background:#eef0f2;font-weight:700}.ptab .r{text-align:right;white-space:nowrap}
.pcl{border-radius:4px;padding:2px 8px;margin:0 -8px 8px}.pcl.hl{background:#fff4bf;box-shadow:inset 3px 0 0 #e0a800}
.pcl b.ref{font-family:Arial,sans-serif;font-size:12px;margin-right:6px}
.pfoot{position:absolute;left:64px;right:64px;bottom:22px;display:flex;justify-content:space-between;gap:12px;font:10px/1.3 Arial,sans-serif;color:#8a8f98;border-top:1px solid #e3e3df;padding-top:6px}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px;font-family:Arial,sans-serif;font-size:12px}
.sig{font-family:"Caveat",cursive;font-size:28px;color:#1b2f7a;height:38px;transform:rotate(-3deg);transform-origin:left;padding-left:6px}
.sline{border-top:1px solid #16181c;padding-top:4px;line-height:1.45}

/* contract review (from WCE) */
.cr-h{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;padding:16px 56px 10px 18px}
.cr-h h2{margin:2px 0;font-size:20px}
.cr-vers{display:flex;align-items:stretch;gap:6px;padding:4px 18px 12px;overflow-x:auto}
.cr-arr{align-self:center;color:var(--faint)}
.cr-ver{display:flex;flex-direction:column;gap:3px;text-align:left;min-width:180px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink)}
.cr-ver b{font-weight:500}.cr-ver.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-dim)}
.cr-st{font-size:12px;display:flex;align-items:center;gap:6px}.cr-st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.cr-st.ok{color:var(--good)}.cr-st.warn{color:var(--warn)}.cr-st.bad{color:var(--crit)}
.cr-tabs{display:flex;gap:4px;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.cr-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);white-space:nowrap}
.cr-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.cr-grid{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:14px;padding:14px 16px 16px}
.crp{border:1px solid var(--line);background:#fdfdfb;color:#16181c;font-family:Georgia,"Times New Roman",serif;font-size:13.5px;line-height:1.6;border-radius:8px;padding:22px 26px;max-height:70vh;overflow:auto}
.crp-b{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:8px;padding:5px 6px;border-radius:4px;margin:0 -6px}
.crp-b.has{background:rgba(255,196,0,.06)}
.crp-r{font:11px/1.9 Arial,sans-serif;color:#888}
.crp-n{display:flex;flex-direction:column;gap:3px}
.cr-num{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font:600 11px Arial,sans-serif;color:#fff;cursor:pointer;flex:none}
.cr-num.high{background:#d93b3b}.cr-num.medium{background:#d98a00}.cr-num.low{background:#6b7480}
mark.cm{background:rgba(255,196,0,.28);color:inherit;border-bottom:2px solid #d98a00;cursor:pointer;padding:0 1px}
mark.cm.high{background:rgba(255,80,80,.18);border-bottom-color:#d93b3b}mark.cm.low{background:rgba(120,130,145,.16);border-bottom-color:#8a929c}
mark.cm.on{outline:2px solid #1a6dd6;outline-offset:1px}
.cr-side{display:flex;flex-direction:column;gap:10px;min-width:0;max-height:70vh}
.cr-sum{border:1px solid var(--line);border-left:3px solid var(--good);border-radius:10px;padding:12px 14px;background:var(--panel-2);display:flex;flex-direction:column;gap:3px}
.cr-sum b{font-size:16px;font-weight:500}.cr-sum.bad{border-left-color:var(--crit)}.cr-sum.warn{border-left-color:var(--warn)}
.cr-cnt{display:flex;gap:12px;margin-top:6px;font-size:12.5px;color:var(--muted)}.cr-cnt i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.cr-cnt i.high{background:#e5484d}.cr-cnt i.medium{background:#f5a524}.cr-cnt i.low{background:#8a929c}
.cr-pb{margin-top:6px;font-size:12.5px}.cr-pb summary{cursor:pointer;color:var(--accent)}
.cr-pb div{display:flex;gap:8px;padding:3px 0;color:var(--muted)}.cr-pb .ok span{color:var(--good)}.cr-pb .no{color:var(--ink)}.cr-pb .no span{color:var(--crit)}
.cr-cards{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px;min-height:0}
.cr-c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:6px;cursor:pointer;font-size:13px;line-height:1.45}
.cr-c:hover{border-color:#c9ced6}.cr-c.on{border-color:var(--accent);background:var(--accent-dim)}
.cr-c-h{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.cr-c-h b{font-weight:500}
.cr-sug{background:var(--panel-2);border-radius:7px;padding:6px 9px;display:flex;flex-direction:column;gap:2px}
.cr-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.cr-act .btn{font-size:12px;padding:3px 9px}
.cr-cmp-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 16px 10px}
.cr-alert{margin:0 16px 12px;padding:12px 14px;border-radius:10px;border:1px solid rgba(229,72,77,.45);background:rgba(229,72,77,.1);font-size:13.5px}.cr-alert b{color:#c62828;font-weight:500}
.cr-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 16px 12px}
.cr-tiles>div{background:var(--panel-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}.cr-tiles b{font-size:22px;font-weight:500}
.cr-ch{margin:0 16px 10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cr-ch.exp{opacity:.75}
.cr-ch-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cr-ch-h b{font-weight:500}
.cr-sev{font-size:11.5px;padding:1px 8px;border-radius:99px}.cr-sev.high{background:rgba(229,72,77,.18);color:#c62828}.cr-sev.medium{background:rgba(245,165,36,.18);color:#9a5b00}.cr-sev.low{background:var(--raise);color:var(--muted)}.cr-sev.ok{background:rgba(47,191,113,.16);color:var(--good)}
.cr-red{border:1px solid var(--line);background:#fdfdfb;color:#16181c;font-family:Georgia,serif;font-size:13.5px;line-height:1.55;border-radius:6px;padding:8px 11px}
.cr-red del{color:#c62828;text-decoration:line-through;background:rgba(229,72,77,.1)}.cr-red ins{color:#1b6e3a;text-decoration:underline;background:rgba(46,160,90,.12)}
.cr-note{font-size:13px;color:var(--muted);line-height:1.45}.cr-note b{color:var(--ink);font-weight:500}
.cr-terms{padding:14px 18px 18px}
.cr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cr-mcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.cr-mcard:hover{border-color:#c9ced6}.cr-mcard b{font-weight:600;font-size:14.5px}

/* charts */
.chart svg{display:block;width:100%;height:auto}
svg text{font-family:var(--f)}
.ax{font-size:10.5px;fill:var(--faint)}.ax-ink{font-size:11px;fill:var(--muted)}
.tip{position:fixed;z-index:60;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 8px 24px rgba(16,24,40,.16);min-width:150px;max-width:280px}
.tip .h{color:var(--muted);margin-bottom:4px}.tip .r{display:flex;justify-content:space-between;gap:14px}.tip .r span:last-child{font-family:var(--m)}
.cov{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) 92px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink)}
.cov:hover{background:var(--panel-2)}.cov:last-child{border-bottom:0}
.cov .t{display:flex;flex-direction:column;min-width:0}.cov .t b{font-weight:500}
.bul{position:relative;height:14px}
.bul .rail{position:absolute;left:0;right:0;top:5px;height:4px;border-radius:2px;background:var(--line)}
.bul .zone{position:absolute;top:3px;height:8px;border-radius:2px;background:color-mix(in srgb,var(--crit) 22%,transparent)}
.bul .lim{position:absolute;top:0;bottom:0;width:2px;background:var(--crit)}
.bul .act{position:absolute;top:1px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--panel)}
.gmap svg{display:block;width:100%;height:auto;min-width:620px}

/* ask drawer */
.ask{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:35;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(16,24,40,.12);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.ask-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.ask-b{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ask-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.ask-f input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.qa{display:flex;flex-direction:column;gap:8px}
.qa .q{align-self:flex-end;background:var(--accent-dim);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:12px 12px 2px 12px;padding:8px 12px;max-width:88%}
.qa .a{background:var(--panel-2);border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:10px 13px;line-height:1.55}
.qa .a p{margin:0 0 6px}.qa .a ul{margin:4px 0 6px;padding-left:18px}
.chat-q{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--ink);font-size:13px;text-align:left}.chat-q:hover{border-color:var(--accent)}
.idchip{background:var(--accent-dim);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent);border-radius:6px;padding:0 5px;font:12px var(--m);cursor:pointer}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.spin{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid rgba(47,111,208,.25);border-top-color:var(--accent);animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(420px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:center;background:#1f2a37;color:#fff;border:1px solid #1f2a37;border-radius:10px;padding:10px 12px;box-shadow:0 12px 30px rgba(16,24,40,.25);font-size:13.5px;animation:mpop .2s ease-out}
.toast span{flex:1}.toast .tx{background:none;border:0;color:#c6ccd5;font-size:18px;line-height:1}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--accent);background:var(--accent-dim)}
.help ol{margin:6px 0 0;padding-left:20px;line-height:1.6}.help li{margin-bottom:6px}.help b{font-weight:500;color:var(--ink)}.help p{color:var(--muted);line-height:1.55}

/* responsive */
@media (max-width:1280px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.s3{grid-column:span 6}.s4,.s5,.s7,.s8{grid-column:span 12}.s6{grid-column:span 12}.cr-grid{grid-template-columns:minmax(0,1fr) 360px}}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;overflow-x:auto;z-index:25;border-right:0;border-top:1px solid var(--line);background:rgba(255,255,255,.97);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
  .side .grp,.side-foot{display:none}
  .nv{flex-direction:column;gap:3px;font-size:11px;padding:6px 10px;width:auto;flex:none}
  .nv[aria-current="page"]::before{display:none}
  .nv .bd{position:absolute;top:2px;right:2px;margin:0;font-size:9.5px;padding:0 5px}
  .ask-in input{width:200px}
  .vhead,.sf-cols,.cr-grid{grid-template-columns:1fr}
  .crp,.cr-side{max-height:none}
  .orx-r{grid-template-columns:70px minmax(0,1fr) 14px}.orx-own,.orx-r .orx-pl{display:none}
  .orx-d{grid-template-columns:1fr;padding:2px 14px 14px}
  .toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat .v{font-size:21px}

function w999(n){ let s=""; if(n>=100){ s+=ONES[Math.floor(n/100)]+" Hundred"; n%=100; if(n) s+=" "; } if(n>=20){ s+=TENS[Math.floor(n/10)]; if(n%10) s+="-"+ONES[n%10]; } else if(n) s+=ONES[n]; return s; }
function words(n){ n=Math.round(n); if(!n) return "Zero"; const u=[[1e9,"Billion"],[1e6,"Million"],[1e3,"Thousand"]]; let s=[]; for(const [v,l] of u){ if(n>=v){ s.push(w999(Math.floor(n/v))+" "+l); n%=v; } } if(n) s.push(w999(n)); return s.join(" "); }

/* ================= FOLLOW-UP: @ask, assign, reply, status → Managed ================= */
const pplOpts=sel=>PEOPLE.filter(p=>p[0]!=="gmd").map(p=>`<option value="${p[0]}" ${p[0]===sel?"selected":""}>${esc(p[1])} · ${esc(p[2])}</option>`).join("");
function openReq(key){ let open=null; thread(key).forEach(t=>{ if(t.type==="ask"||t.type==="assign") open={...t}; else if(open&&(t.type==="done"||(t.type==="status"&&/Managed|Done|On track/.test(t.value)))) open=null; else if(open&&t.type==="reply") open.replied=t; }); return open; }
function openFollowups(){ return allObs().map(o=>({o,r:openReq("ob:"+o.id)})).filter(x=>x.r); }
function followLine(o){ const T=thread("ob:"+o.id).filter(t=>t.type!=="plan"); if(!T.length){ const p=planOf(o.id); return p?{cls:p.conf==="on"?"ok":"info",txt:`${person(p.by).name} is managing it: “${p.plan.slice(0,70)}${p.plan.length>70?"…":""}”`}:null; }
  const last=T[T.length-1], who=person(last.by).name.replace("Group Managing Director","GMD");
  if(last.type==="status"||last.type==="done") return {cls:/Managed|On track|Done/.test(last.value||"Managed")?"ok":"warn",txt:`${who} set ${last.value||"Managed"} ${ago(last.at)}`};
  if(last.type==="reply") return {cls:"ok",txt:`${who} replied ${ago(last.at)}`};
  if(last.type==="assign") return {cls:"info",txt:`Assigned to ${person(last.to).name} · due ${dFmt(last.due)}`};
  if(last.type==="ask") return {cls:"warn",txt:`Asked ${person(last.to).name} ${ago(last.at)} · awaiting reply`};
  return null; }
function followHTML(o){ const key="ob:"+o.id, T=thread(key).filter(t=>t.type!=="plan"), PL=planOf(o.id), line=followLine(o), req=openReq(key), resp=req?req.to:o.own, st=effStatus(o);
  return `<div class="ldl obf" data-ob="${o.id}"><div class="ldl-h"><span class="lbl">Follow-up</span><span class="st ${stc(st)}" style="font-weight:600">${esc(st)}</span>${line?`<span class="ldl-st ${line.cls}">${esc(line.txt)}</span>`:`<span class="lbl">Owner: ${esc(person(o.own).name)}, ${esc(person(o.own).role)}</span>`}<span style="flex:1"></span><button class="btn" data-of="ask">@ Ask for update</button><button class="btn" data-of="assign">${svg("users",14)}Assign follow-up</button><button class="btn" data-of="status">Update status</button></div>
   ${PL?`<div class="obf-plan"><span class="lbl">How it's managed · ${esc(person(PL.by).name)} · ${ago(PL.at)} · ${(CONF[PL.conf]||CONF.on)[0]}</span><div>${esc(PL.plan)}</div>${PL.next?`<span class="lbl">Next: ${esc(PL.next)}${PL.nextDate?" · "+dFmt(PL.nextDate):""}</span>`:""}</div>`:""}
   <div class="ldl-form" hidden></div>
   ${T.length?`<div class="ldl-thr">${T.map(t=>{ const me=t.by==="gmd", who=me?"GMD":person(t.by).name, to=t.to?person(t.to).name:""; const verb={ask:`asked @${to}`,assign:`assigned follow-up to @${to}${t.due?" · due "+dFmt(t.due):""}`,reply:"replied",status:`set the status to <b>${esc(t.value)}</b>`,done:"marked the follow-up done · <b>Managed</b>"}[t.type]||t.type;
     return `<div class="ldl-m ${me?"me":""}"><span class="av">${me?"GMD":esc(ini(who))}</span><div><b>${esc(who)}</b> <span class="lbl">${verb} · ${ago(t.at)}</span>${t.text?`<div>${esc(t.text)}</div>`:""}</div></div>`; }).join("")}
     ${req?`<div class="ldl-reply"><span class="lbl">Reply as ${esc(person(resp).name)} (demo)</span><input placeholder="e.g. Bank confirmed; letter by Friday" aria-label="Reply"><button class="btn" data-of="reply" data-to="${resp}">Reply</button>${req.type==="assign"?`<button class="btn" data-of="done" data-to="${resp}">Mark done</button>`:""}</div>`:""}</div>`:""}</div>`; }
function followWire(root,o,after){ const box=root.querySelector(`.obf[data-ob="${o.id}"]`); if(!box) return; const key="ob:"+o.id, form=box.querySelector(".ldl-form");
  box.addEventListener("click",e=>e.stopPropagation());
  box.querySelectorAll("[data-of]").forEach(b=>b.onclick=async()=>{ const a=b.dataset.of;
    if(a==="reply"){ const inp=box.querySelector(".ldl-reply input"), v=(inp.value||"").trim(); if(!v){ inp.focus(); return; } await post({key,type:"reply",by:b.dataset.to,text:v}); toast("Reply added."); after(); render(); return; }
    if(a==="done"){ await post({key,type:"done",by:b.dataset.to,value:"Managed",text:(box.querySelector(".ldl-reply input").value||"").trim()}); toast(`${o.id} is now Managed.`); after(); render(); return; }
    form.hidden=false; const st=effStatus(o);
    if(a==="status"){ const req=openReq(key); form.innerHTML=`<div class="ldl-row"><label class="lbl" for="ofSt">New status</label><select class="btn" id="ofSt">${STATES.map(s=>`<option ${s===(/At risk|Overdue/.test(st)?"Action in progress":/Action/.test(st)?"Managed":st)?"selected":""}>${s}</option>`).join("")}</select><label class="lbl" for="ofBy">Updated by</label><select class="btn" id="ofBy"><option value="gmd">GMD</option>${pplOpts(req?req.to:o.own)}</select></div>
        <textarea class="ta" id="ofTxt" rows="2" placeholder="What changed, e.g. bank confirmed the waiver; letter dated 24 Oct"></textarea>
        <div class="tb"><button class="btn pri" id="ofGo">Update status</button><button class="btn" id="ofNo">Cancel</button><span class="lbl">Managed means it has an agreed plan and owner; it leaves the at-risk count.</span></div>`;
      form.querySelector("#ofNo").onclick=()=>form.hidden=true;
      form.querySelector("#ofGo").onclick=async()=>{ const v=form.querySelector("#ofSt").value; form.querySelector("#ofGo").disabled=true; await post({key,type:"status",value:v,by:form.querySelector("#ofBy").value,text:form.querySelector("#ofTxt").value.trim()}); toast(`${o.id} is now ${v}.`); after(); render(); }; return; }
    const due=dISO(new Date(TODAY.getTime()+3*864e5));
    form.innerHTML=`<div class="ldl-row"><label class="lbl" for="ofTo">${a==="ask"?"Tag":"Assign to"}</label><select class="btn" id="ofTo">${pplOpts(o.own)}</select>${a==="assign"?`<label class="lbl" for="ofDue">Due</label><input type="date" id="ofDue" value="${due}" class="btn">`:""}</div>
      <textarea class="ta" id="ofTxt" rows="2">${esc(a==="ask"?`What's the latest on "${o.t}" (${o.ref})? What do you need from me to get it on track?`:`Please take ownership of "${o.t}" (${o.ref}): agree the plan, update the status here, and mark it done when it's in hand.`)}</textarea>
      <div class="tb"><button class="btn pri" id="ofGo">${a==="ask"?"Send":"Assign"}</button><button class="btn" id="ofNo">Cancel</button><span class="lbl">${a==="assign"?"It appears under Follow-ups; marking it done sets the obligation to Managed.":"Their reply shows here and under Follow-ups."}</span></div>`;
    form.querySelector("#ofNo").onclick=()=>form.hidden=true;
    form.querySelector("#ofGo").onclick=async()=>{ const to=form.querySelector("#ofTo").value, txt=form.querySelector("#ofTxt").value.trim(); if(!txt) return; form.querySelector("#ofGo").disabled=true;
      const e={key,type:a,by:"gmd",to,text:txt}; if(a==="assign") e.due=form.querySelector("#ofDue").value||due; await post(e);
      toast(a==="assign"?`Assigned to ${person(to).name}.`:`@${person(to).name} tagged for an update.`); after(); render(); }; }); }

function renderFollow(){ const L=openFollowups(), all=allObs().filter(o=>thread("ob:"+o.id).some(t=>t.type!=="plan")).sort((a,b)=>{ const la=thread("ob:"+a.id).pop().at, lb=thread("ob:"+b.id).pop().at; return String(lb).localeCompare(String(la)); });

  wireObRows($("#page")); $$("#page [data-open]").forEach(r=>r.onclick=()=>openOb(r.dataset.open)); }

let riskF="", riskOpen=null;
function risks(){ return allObs().map(o=>({...o,lv:LVL(o.status)})).filter(o=>o.lv).sort((a,b)=>a.lv[2]-b.lv[2]||(planOf(a.id)?1:0)-(planOf(b.id)?1:0)); }
function renderRisk(){ const R=risks(), n=k=>R.filter(o=>o.lv[0]===k).length, has=o=>!!planOf(o.id), planned=R.filter(has).length, nop=R.filter(o=>!has(o)&&o.lv[0]!=="mng").length;
  const F=R.filter(o=>!riskF||(riskF==="noplan"?!has(o)&&o.lv[0]!=="mng":o.lv[0]===riskF));
  $("#page").innerHTML=`<div class="ph"><div><h1>Risks</h1><div class="sub">Obligations from high risk down to watch, across every venture. Click one to see who owns it and how it's being managed; owners add their plan and move it to Managed.</div></div></div>
   <div class="p"><div class="orx-sum"><div class="orx-k high"><b>${n("high")}</b><span>High</span></div><div class="orx-k hand"><b>${n("hand")}</b><span>In hand</span></div><div class="orx-k watch"><b>${n("watch")}</b><span>Watch</span></div><div class="orx-k mng"><b>${n("mng")}</b><span>Managed</span></div>
     <div class="orx-ctl"><div class="orx-bar"><i style="width:${R.length?Math.round(planned/R.length*100):0}%"></i></div><span class="lbl">${planned} of ${R.length} risks have a plan from their owner${nop?` · <b style="color:var(--warn);font-weight:500">${nop} still need${nop>1?"":"s"} one</b>`:""}</span></div></div>
    <div class="fil" style="padding:0 16px 10px">${[["","All "+R.length],["high","High"],["hand","In hand"],["watch","Watch"],["mng","Managed"],["noplan","No plan yet"]].map(([k,l])=>`<button data-f="${k}" aria-pressed="${riskF===k}">${l}</button>`).join("")}</div>
    <div>${F.map(riskRow).join("")||'<div class="fr-empty">Nothing in this view.</div>'}</div></div>`;
  $$("#page .fil [data-f]").forEach(b=>b.onclick=()=>{ riskF=b.dataset.f; renderRisk(); });
  $$("#page .orx-r").forEach(b=>b.onclick=()=>{ const id=b.parentElement.dataset.id; riskOpen=riskOpen===id?null:id; renderRisk(); });
  const row=$("#page .orx.open"); if(row) riskWire(row,R.find(o=>o.id===row.dataset.id)); }
function riskRow(o){ const p=planOf(o.id), own=person(p?p.by:o.own), open=riskOpen===o.id, c=p?CONF[p.conf]||CONF.on:null;
  return `<div class="orx ${o.lv[0]} ${open?"open":""}" data-id="${o.id}"><button class="orx-r" aria-expanded="${open}"><span class="orx-lv">${o.lv[1]}</span><span class="orx-t"><b>${esc(o.t)}</b><span class="lbl">${o.id} · ${esc(VEN(o.file.ven).name)} · ${esc(o.file.title)} · due ${dueTxt(o)}</span></span>
   <span class="orx-own"><span class="av">${esc(ini(own.name))}</span><span><b>${esc(own.name)}</b><span class="lbl">${esc(own.role)}</span></span></span><span class="orx-pl ${c?c[1]:"none"}">${c?`${c[0]} · ${ago(p.at)}`:"No plan yet"}</span><span class="orx-chev" aria-hidden="true">›</span></button>${open?riskDrawer(o):""}</div>`; }
function riskDrawer(o){ const p=planOf(o.id), H=plansOf(o.id).slice(0,-1).reverse(), own=person(p?p.by:o.own), c=p?CONF[p.conf]||CONF.on:null;
  return `<div class="orx-d"><div class="orx-plan">${whyOf(o)?`<div class="why" style="margin-bottom:8px"><b class="st ${stc(o.status)}">Why it's ${esc(o.status.toLowerCase())}:</b> ${esc(whyOf(o))}</div>`:""}${p?`<div class="lbl">How we're managing it</div><div class="orx-txt">${esc(p.plan)}</div><div class="tb"><span><span class="lbl">Next step</span> ${esc(p.next||"—")}${p.nextDate?` · <b>${dFmt(p.nextDate)}</b>`:""}</span><span class="orx-pl ${c[1]}">${c[0]}</span></div><div class="lbl">Updated by ${esc(person(p.by).name)} · ${ago(p.at)}${H.length?` · ${H.length} earlier update${H.length>1?"s":""}`:""}</div>`
     :`<div class="orx-none"><b>No plan from the owner yet</b><span class="lbl">${esc(own.name)} hasn't said how this is being handled. Ask them, or add the plan for them.</span></div>`}<div class="clause" style="margin-top:8px">${esc(clauseText(o,o.file))}</div><div class="orx-form" hidden style="margin-top:8px;display:flex;flex-direction:column;gap:8px"></div></div>
   <div class="orx-side"><div class="orx-oc"><span class="av">${esc(ini(own.name))}</span><div><div class="lbl">Owner</div><b>${esc(own.name)}</b><div class="lbl">${esc(own.role)}</div></div></div><button class="btn pri" data-x="plan">${p?"Update the plan":"Add the plan"}</button><button class="btn" data-x="ask">@ Ask for update</button><button class="btn" data-x="assign">Assign follow-up</button><button class="btn" data-x="file">Open in the contract</button></div></div>`; }

      <div class="ldl-row"><label class="lbl" for="orNext">Next step</label><input class="inp" id="orNext" value="${esc(p?p.next||"":"")}" placeholder="e.g. Bank meeting"><label class="lbl" for="orDate">by</label><input type="date" class="btn" id="orDate" value="${p&&p.nextDate||due}"></div>
      <div class="ldl-row"><span class="lbl">Confidence</span><div class="seg" id="orConf">${Object.entries(CONF).map(([k,v])=>`<button type="button" data-c="${k}" aria-pressed="${k===conf}">${v[0]}</button>`).join("")}</div></div>
      <div class="tb"><button class="btn pri" id="orGo">Save</button><button class="btn" id="orNo">Cancel</button><span class="lbl">The GMD sees this here, in the contract and on the overview.</span></div>`;
    form.querySelectorAll("#orConf [data-c]").forEach(c=>c.onclick=()=>{ conf=c.dataset.c; form.querySelectorAll("#orConf [data-c]").forEach(z=>z.setAttribute("aria-pressed",z===c)); });
    form.querySelector("#orNo").onclick=()=>renderRisk();
    form.querySelector("#orGo").onclick=async()=>{ const plan=form.querySelector("#orPlan").value.trim().slice(0,600); if(!plan){ form.querySelector("#orPlan").focus(); return; } form.querySelector("#orGo").disabled=true; const by=form.querySelector("#orBy").value, st=form.querySelector("#orSt").value;
      await post({key,type:"plan",by,plan,next:form.querySelector("#orNext").value.trim().slice(0,120),nextDate:form.querySelector("#orDate").value,conf});
      const cur=/Overdue/.test(o.status)?"At risk":o.status; if(st!==cur) await post({key,type:"status",value:st,by,text:plan.slice(0,160)});
      toast(st!==cur?`Plan saved. ${o.id} is now ${st}.`:"Plan saved."); render(); }; }); }

function wdiff(a,b){ const A=a.split(/(\s+|[,;()]|\.(?=\s|$))/).filter(Boolean), B=b.split(/(\s+|[,;()]|\.(?=\s|$))/).filter(Boolean), n=A.length, mm=B.length, dp=Array.from({length:n+1},()=>new Int16Array(mm+1)); for(let i=n-1;i>=0;i--) for(let j=mm-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,o=""; while(i<n&&j<mm){ if(A[i]===B[j]){ o+=esc(A[i]); i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]){ o+=`<del>${esc(A[i])}</del>`; i++; } else { o+=`<ins>${esc(B[j])}</ins>`; j++; } } while(i<n) o+=`<del>${esc(A[i++])}</del>`; while(j<mm) o+=`<ins>${esc(B[j++])}</ins>`; return o; }
function crDiff(A,B){ const out=[]; B.blocks.forEach(b=>{ const a=A.blocks.find(x=>x.key===b.key); if(!a) out.push({key:b.key,ref:b.ref,title:b.title,kind:"add",after:b.text}); else if(a.text!==b.text) out.push({key:b.key,ref:b.ref,title:b.title,kind:"mod",before:a.text,after:b.text}); }); A.blocks.forEach(a=>{ if(!B.blocks.some(x=>x.key===a.key)) out.push({key:a.key,ref:a.ref,title:a.title,kind:"del",before:a.text}); }); return out; }

let pdfReady=null; function loadPdfJs(){ if(pdfReady) return pdfReady; const ld=src=>new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });

    for(let i=1;i<=Math.min(doc.numPages,60);i++){ const pg=await doc.getPage(i), c=await pg.getTextContent(); text+=c.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("")+"\n\n"; }
    if(text.replace(/\s/g,"").length<300){ if(!sample) throw {code:"scan"}; note("Scanned copy · AI is reading the pages…"); const imgs=[]; for(let n=1;n<=Math.min(4,doc.numPages);n++){ const pg=await doc.getPage(n), vp=pg.getViewport({scale:1.4}), cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height; await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise; imgs.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",.85))); } return (await sample("Transcribe this document's text exactly. Plain text only.",{images:imgs,modelTier:"default"})).text; }
    return text; }
  if(/^image\//.test(file.type)){ if(!sample) throw {code:"scan"}; note("AI is reading the photo…"); return (await sample("Transcribe this document's text exactly. Plain text only.",{images:[file],modelTier:"default"})).text; }
  const t=await file.text(); return /\.html?$/i.test(file.name)?t.replace(/<[^>]+>/g," "):t; }

function heurExtract(text,name){ const t=text.toLowerCase(), sents=text.replace(/\s+/g," ").split(/(?<=[.;])\s+(?=[A-Z0-9(])/).filter(s=>/\b(shall|must|within|not later than|not less than|at least|maintain|deliver)\b/i.test(s)).slice(0,12);
  const due=s=>{ const m=s.match(/(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(20\d\d)/i); if(m) return dISO(new Date(`${m[1]} ${m[2]} ${m[3]} 12:00 GMT+0800`)); return /each|every|annual|quarter|month/i.test(s)?"cont":"event"; };
  const ty=s=>/net worth|gearing|cover|ratio/i.test(s)?"covenant":/statement|accounts|report/i.test(s)?"report":/guarantee|charge|security/i.test(s)?"security":/review|renew/i.test(s)?"renewal":/consent|notify|notice/i.test(s)?"notice":/insur/i.test(s)?"insurance":/pay|repay/i.test(s)?"payment":"notice";
  const own=s=>/accounts|statement/i.test(s)?"acc":/guarantee|borrow|facilit/i.test(s)?"trs":/net worth|covenant/i.test(s)?"cfo":"leg";
  return {title:name.replace(/\.[a-z]+$/i,""),venture:/steelaris|singapore|3ha|sgd/.test(t)?"inv":/purlin|coil|plant/.test(t)?"mfg":/bim|model/.test(t)?"bim":/bursa|listing/.test(t)?"grp":"trd",category:/bank|facilit|loan|financing/.test(t)?"bank":/insur/.test(t)?"ins":/tenancy|lease|licen/.test(t)?"plant":/supply|purchase/.test(t)?"sup":"corp",party:(text.match(/^([A-Z][A-Z &.]+(?:LTD|BERHAD|BHD|PTE LTD))/m)||[])[1]||"Counterparty to confirm",summary:"Read by the built-in reader; check the obligations against the document. Opened in Claude, AI reads it in full.",terms:[],
    obligations:sents.map((s,i)=>({title:s.replace(/^\d+\.\s*[A-Z][a-z ]+\.\s*/,"").slice(0,110),ref:(s.match(/^(\d+)\./)||[])[1]?"Cl. "+s.match(/^(\d+)\./)[1]:"Cl. "+(i+1),owner:own(s),due:due(s),type:ty(s),evidence:["Copy of the document or submission"]}))}; }
function wireUpload(){ const drop=$("#drop"); if(!drop) return; $("#sfAdd").onclick=()=>$("#sfFile").click(); $("#sfFile").onchange=e=>{ const f=e.target.files?.[0]; e.target.value=""; if(f) sfImport(f); };
  $("#sfSample").onclick=()=>sfImport(new File([SAMPLE_LETTER],"Orchard Trade Bank - Steelaris offer.txt",{type:"text/plain"}));
  drop.ondragover=e=>{ e.preventDefault(); drop.classList.add("over"); }; drop.ondragleave=()=>drop.classList.remove("over"); drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove("over"); const f=e.dataTransfer.files?.[0]; if(f) sfImport(f); }; }
async function sfImport(file){ const m=$("#sfMsg"), note=t=>{ if(m) m.textContent=t; }; note(`AI is reading ${file.name}…`); const btn=$("#sfAdd"); if(btn) btn.disabled=true;
  try{ const text=await fileText(file,note); let r=null; if(sample){ try{ note("AI is finding the obligations…"); r=await sample.json(SF_PROMPT(text),{modelTier:"default"}); }catch(e){ r=null; } }
    if(!r||!Array.isArray(r.obligations)||!r.obligations.length) r=heurExtract(text,file.name);
    const base=900+ADDED.length*20, f={id:"SF-U"+Date.now().toString(36),ven:VENTURES.some(v=>v[0]===r.venture)?r.venture:"grp",cat:CATS.some(c=>c[0]===r.category)?r.category:"added",title:String(r.title||file.name).slice(0,80),ref:file.name.slice(0,60),party:String(r.party||"—").slice(0,90),signed:"Uploaded "+dFmt(new Date()),term:"—",ver:"Uploaded copy",pages:Math.max(1,Math.round(text.length/3000)),ai:true,summary:String(r.summary||"").slice(0,600),terms:(r.terms||[]).slice(0,5).map(String),text:String(text).slice(0,18000),
      obs:(r.obligations||[]).slice(0,20).map((o,i)=>ob(`OB-${base+i}`,String(o.title||"Obligation").slice(0,140),String(o.ref||"—").slice(0,30),PEOPLE.some(p=>p[0]===o.owner)?o.owner:"leg",/^\d{4}-\d\d-\d\d$/.test(o.due)||o.due==="cont"||o.due==="event"?o.due:"cont","Watch",OB_TYPES.some(t=>t[0]===o.type)?o.type:"notice",(o.evidence||[]).map(String).filter(Boolean).slice(0,3),0))};
    f.count=f.obs.length; if(!f.count) throw {code:"none"};
    if(db){ try{ await db.collection("files").doc(f.id).set(f); }catch(e){ ADDED.push(f); lsSet("ays_added",ADDED); } } else { ADDED.push(f); lsSet("ays_added",ADDED); }
    mergeAdded(); note(""); drill={mode:"venture",ven:f.ven,cat:f.cat}; lsSet("ays_drill",drill); render(); openSF(f.id); toast(`AI found ${f.count} obligation${f.count>1?"s":""} in ${file.name} and filed it under ${VEN(f.ven).name} › ${CAT(f.cat).name}.`); }
  catch(e){ note(e?.code==="none"?"No obligations found in that file.":e?.code==="scan"?"Scanned copies and photos are read by AI when this page is opened in Claude.":"Couldn't read that file."); }
  finally{ const b=$("#sfAdd"); if(b) b.disabled=false; } }
function mergeAdded(){ const base=SF.filter(f=>!f.ai), add=[...(liveFiles||[]),...ADDED].filter((f,i,a)=>a.findIndex(x=>x.id===f.id)===i); SF=[...base,...add]; }

const REVIEW_PROMPT=(txt,kind)=>`You review contracts for AYS Ventures Berhad, a Malaysian listed steel trading group. Review this ${kind} against AYS's standard positions:
${(kind==="bank facility letter"?PLAYBOOK_BANK:PLAYBOOK_SALE).map(p=>"- "+p[1]).join("\n")}
- Anything else that costs AYS money or adds risk.
The text is split into numbered blocks like [B3]. Reply with only JSON: {"summary":"one sentence verdict","comments":[{"block":"B3","quote":"exact short phrase from that block","severity":"high|medium|low","category":"short label","comment":"plain-English concern with numbers where possible","suggestion":"wording to ask for"}]} with at most 8 comments.
TEXT:
${txt}`;
async function crUpload(file){ const m=$("#crMsg"), note=t=>{ if(m) m.textContent=t; }; note(`Reading ${file.name}…`);
  try{ const text=await fileText(file,note), paras=text.split(/\n\s*\n|\n(?=\d+\.)/).map(s=>s.replace(/\s+/g," ").trim()).filter(s=>s.length>20).slice(0,80), blocks=paras.map((p,i)=>({key:"B"+(i+1),ref:(p.match(/^(\d+(\.\d+)*)/)||[])[1]||String(i+1),title:"",text:p}));
    const kind=/bank|facilit|borrower/i.test(text)?"bank facility letter":"customer or supply contract"; let ai=null, sum="";
    if(sample){ try{ note("AI is reviewing it…"); const r=await sample.json(REVIEW_PROMPT(blocks.map(b=>`[${b.key}] ${b.text}`).join("\n").slice(0,30000),kind),{modelTier:"default"}); sum=String(r.summary||""); ai=(r.comments||[]).slice(0,8).map(c=>({key:String(c.block||"").replace(/[\[\]]/g,""),pb:null,quote:String(c.quote||""),sev:["high","medium","low"].includes(c.severity)?c.severity:"low",cat:String(c.category||""),text:String(c.comment||""),sug:String(c.suggestion||"")})); }catch(e){ ai=null; } }
    if(!ai){ ai=[]; blocks.forEach(b=>{ const t=b.text; if(/sole (opinion|discretion)/i.test(t)) ai.push({key:b.key,quote:(t.match(/sole (opinion|discretion)[^,.;]*/i)||[""])[0],sev:"high",cat:"Discretion",text:"A right exercised at the other side's sole opinion.",sug:"Make it reasonable and subject to notice."}); if(/consequential/i.test(t)===false&&/indemnif/i.test(t)) ai.push({key:b.key,quote:"indemnif",sev:"high",cat:"Liability",text:"Indemnity with no cap or exclusion of consequential loss.",sug:CMT.cons.sug}); if(/guarantee/i.test(t)) ai.push({key:b.key,quote:(t.match(/corporate guarantee[^,.;]*/i)||[""])[0],sev:"medium",cat:"Guarantee",text:"A new guarantee from the holding company needs board approval and may need a Bursa announcement.",sug:"Confirm board approval and percentage ratios."}); if(/net worth|gearing|cover/i.test(t)) ai.push({key:b.key,quote:(t.match(/(tangible net worth|gearing|cover)[^,.;]*/i)||[""])[0],sev:"medium",cat:"Covenant",text:"A financial covenant to add to the covenant tracker.",sug:"Check headroom against the latest accounts."}); }); sum=ai.length?"Built-in checks only; opened in Claude, AI reviews the full text.":"Built-in checks found nothing; opened in Claude, AI reviews the full text."; }
    const mm={key:"up"+Date.now().toString(36),title:file.name.replace(/\.[a-z]+$/i,""),sub:`Uploaded ${kind}`,pb:kind==="bank facility letter"?PLAYBOOK_BANK:PLAYBOOK_SALE,party:"the counterparty",versions:[{id:"v1",label:"Uploaded copy",date:dISO(new Date()),by:"Uploaded by you",blocks,L:{},ai,aiSummary:sum,aiNote:sample?"AI read the full text against AYS's standard positions.":"Built-in checks only."}]};
    CR_UP.push(mm); note(""); renderReview(); openCR(mm); }
  catch(e){ note(e?.code==="scan"?"Scanned copies and photos are read by AI when this page is opened in Claude.":"Couldn't read that file."); } }

/* ================= ASK ================= */
function askContext(){ return JSON.stringify({today:dISO(TODAY),reported:REPORTED,facilities:linesOf().map(l=>({bank:BANKS[l.bank][0],line:l.name,venture:VEN(l.ven).name,limit:l.limit,drawn:l.used,nonfunded:l.nonfunded})),covenants:COVENANTS.map(c=>({name:c[2],file:c[1],actual:c[3],limit:c[4],type:c[5],unit:c[6],status:covStatus(c)[1]})),guarantees:GUARANTEES.map(g=>({lender:BANKS[g[0]][0],for:g[1],rm_m:g[2]})),
  obligations:allObs().map(o=>({id:o.id,title:o.t,contract:o.file.title,venture:VEN(o.file.ven).name,function:CAT(o.file.cat).name,owner:person(o.own).name,due:o.due,status:o.status,plan:planOf(o.id)?.plan||null})),maturities_next_60_days:DRAWS.filter(x=>days(x.d)<=60).map(x=>({date:dISO(x.d),bank:BANKS[x.bank][0],line:x.line,rm_m:x.amt}))}); }
function cannedAnswer(q){ const t=q.toLowerCase(), A=allObs(), bankKey=Object.keys(BANKS).find(k=>t.includes(BANKS[k][0].split(" ")[0].toLowerCase())||t.includes(BANKS[k][0].split(" ")[1].toLowerCase()));
  const list=L=>`<ul>${L.slice(0,8).map(o=>`<li><span class="idchip" data-id="${o.id}">${o.id}</span> ${esc(o.t)} · ${dueTxt(o)} · <span class="st ${stc(o.status)}">${esc(o.status)}</span></li>`).join("")}</ul>`;
  if(bankKey){ const F=SF.filter(f=>f.bank===bankKey), L=A.filter(o=>F.includes(o.file)).filter(o=>!/cont|event/.test(o.due)).sort((a,b)=>dParse(a.due)-dParse(b.due)); const ft=facTotals(F); return `<p><b>${esc(BANKS[bankKey][0])}</b>: ${rm(ft.used)} drawn of ${rm(ft.lim)} funded limits.</p><p>Dated obligations:</p>${list(L)}`; }
  if(/headroom|facilit|limit|drawn|borrow/.test(t)){ const ft=facTotals(); return `<p>Funded limits ${rm(ft.lim)}, drawn ${rm(ft.used)}, so headroom is <b>${rm(ft.head)}</b> (${Math.round((1-ft.pct)*100)}%). Drawn ties to reported group borrowings of ${rm(REPORTED.borrow)} at ${REPORTED.asAt} ◆ (down from ${rm(REPORTED.borrowPrev)}); cash was ${rm(REPORTED.cash)} ◆.</p><p>Tightest lines: Selat's revolving credit is fully drawn and rolls on 6 Nov, and its bankers' acceptance line is 92% used.</p>`; }
  if(/covenant|gearing|dscr|ratio/.test(t)) return `<p>${COVENANTS.filter(c=>covStatus(c)[0]!=="ok").length} covenants need watching:</p><ul>${COVENANTS.filter(c=>covStatus(c)[0]!=="ok").map(c=>`<li>${esc(c[2])}: ${c[3]} vs ${c[5]} ${c[4]} (${covStatus(c)[1]}) · <span class="idchip" data-id="${c[8]}">${c[8]}</span></li>`).join("")}</ul>`;
  if(/risk|worr|attention|urgent/.test(t)){ const R=A.filter(o=>/At risk|Overdue/.test(o.status)); return `<p>${R.length} obligations are at risk or overdue:</p>${list(R)}`; }
  if(/due|week|month|next|deadline/.test(t)){ const L=A.filter(o=>{ const d=dParse(o.due); return d&&days(d)>=0&&days(d)<=(/week/.test(t)?7:31); }).sort((a,b)=>dParse(a.due)-dParse(b.due)); return `<p>${L.length} dated obligations in the next ${/week/.test(t)?"7":"31"} days:</p>${list(L)}`; }
  if(/guarant/.test(t)) return `<p>AYS Ventures Berhad has given ${GUARANTEES.length} corporate guarantees totalling ${rm(GUARANTEES.reduce((a,g)=>a+g[2],0))}, the largest to Selat Bank (RM 230m) and Bank Muara (RM 160m).</p>`;
  return `<p>I can answer from the smart files, facilities and covenants. Try asking about a bank, headroom, covenants, risks or what's due this month.</p>`; }
async function ask(q){ const B=$("#askB"), qa=document.createElement("div"); qa.className="qa"; qa.innerHTML=`<div class="q">${esc(q)}</div><div class="a"><span class="dots"><i></i><i></i><i></i></span></div>`; B.appendChild(qa); B.scrollTop=B.scrollHeight; const a=qa.querySelector(".a");
  let html=null; if(sample){ try{ const r=await sample(`You answer questions for the Group MD of AYS Ventures Berhad about the group's contract obligations, bank facilities, covenants and guarantees, using only the data below (illustrative demo data except 'reported'). Be brief and specific, lead with the answer, use numbers. Refer to obligations by id in square brackets like [OB-201]. Use short bullet lines starting with "- " when listing. No headings.
DATA: ${askContext()}
QUESTION: ${q}`,{modelTier:"default",cache:false,onText:({text})=>{ a.innerHTML=fmtAns(text); }}); html=fmtAns(r.text); $("#askEng").textContent="Claude"; }catch(e){ html=null; } }
  a.innerHTML=html||cannedAnswer(q); a.querySelectorAll("[data-id]").forEach(c=>c.onclick=()=>{ $("#ask").hidden=true; openOb(c.dataset.id); }); B.scrollTop=B.scrollHeight; }
function fmtAns(t){ const lines=esc(t).split(/\n+/); let o="",ul=false; lines.forEach(l=>{ const li=/^\s*[-•*]\s+/.test(l); if(li&&!ul){ o+="<ul>"; ul=true; } if(!li&&ul){ o+="</ul>"; ul=false; } const x=l.replace(/^\s*[-•*]\s+/,"").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[(OB-\d+)\]/g,'<span class="idchip" data-id="$1">$1</span>'); o+=li?`<li>${x}</li>`:x.trim()?`<p>${x}</p>`:""; }); return o+(ul?"</ul>":""); }
function openAsk(q){ const p=$("#ask"); p.hidden=false; const B=$("#askB"); if(!B.children.length) B.innerHTML=`<div class="lbl">Answers come from the smart files, facility lines, covenants and follow-ups on this page.</div><div class="tb">${["How much headroom do we have?","What's at risk right now?","Which covenants are tight?","What's due at Selat Bank?","What's due this week?"].map(x=>`<button class="chat-q">${x}</button>`).join("")}</div>`; $$("#askB .chat-q").forEach(b=>b.onclick=()=>ask(b.textContent)); if(q) ask(q); else $("#askIn").focus(); }
