<style>
:root{--bg:#090d12;--panel:#111821;--line:#223041;--ink:#e7edf4;--muted:#8a97a8;--accent:#4cc2ff;--crit:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,"Helvetica Neue",Helvetica,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 75% -10%,rgba(76,194,255,.13),transparent 60%),linear-gradient(180deg,#090d12,#0b1118)}
.bg svg{position:absolute;left:0;right:0;bottom:8%;width:100%;height:140px;opacity:.5}
.card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:22px}.brand b{font-weight:600;font-size:17px}.plate{background:#fff;border-radius:12px;padding:12px 16px;width:100%;display:flex;justify-content:center}.plate img{height:64px;width:auto;display:block}
h1{font-size:22px;font-weight:500;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=password]{width:100%;background:#0b1118;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--muted)}
button{width:100%;margin-top:18px;background:var(--accent);color:#06121c;border:0;border-radius:10px;padding:12px;font:600 15px Arial,"Helvetica Neue",Helvetica,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{color:var(--crit);font-size:13.5px;min-height:20px;margin-top:10px}
.foot{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}
</style></head>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), bu=a=>btoa(String.fromCharCode(...a));
async function openWith(raw,user){ const ck=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(PAYLOAD.iv)},ck,ub(PAYLOAD.ct));
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close(); }
async function unwrap(user,pass){ const u=USERS[user]; if(!u) return null; const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(u.s),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  try{ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(u.iv)},kek,ub(u.w))); }catch(e){ return null; } }
(async()=>{ let k=null,u=null; try{ k=sessionStorage.getItem('wce_k')||localStorage.getItem('wce_k'); u=sessionStorage.getItem('wce_user')||localStorage.getItem('wce_user'); }catch(e){}
  if(k){ try{ await openWith(ub(k),u); return; }catch(e){ try{ sessionStorage.removeItem('wce_k'); localStorage.removeItem('wce_k'); }catch(x){} } }
  document.getElementById('u').focus(); })();
document.getElementById('f').addEventListener('submit',async e=>{ e.preventDefault(); const err=document.getElementById('err'), b=document.getElementById('go');
  const user=document.getElementById('u').value.trim().toLowerCase(), pass=document.getElementById('p').value;
  err.textContent=''; b.disabled=true; b.textContent='Signing in…';
  const raw=await unwrap(user,pass);
  if(!raw){ err.textContent='That username and password don’t match. Check both and try again.'; b.disabled=false; b.textContent='Sign in'; document.getElementById('p').select(); return; }
  try{ const keep=document.getElementById('keep').checked; sessionStorage.setItem('wce_k',bu(raw)); sessionStorage.setItem('wce_user',user); if(keep){ localStorage.setItem('wce_k',bu(raw)); localStorage.setItem('wce_user',user); } }catch(x){}
  try{ await openWith(raw,user); }catch(x){ err.textContent='This browser could not open the app. Use a current version of Chrome, Edge, Safari or Firefox.'; b.disabled=false; b.textContent='Sign in'; } });
