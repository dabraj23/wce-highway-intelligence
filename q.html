<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>WCE Care · Maklum balas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f6f9;--ink:#0b1220;--muted:#5d6878;--line:#cfd6df;--card:#fff;--brand:#0b1220;--accent:#4cc2ff;--good:#1f9d5a;--crit:#d93b3b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Geist",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
header b{color:var(--accent);font-size:18px}header span{display:block;font-size:13px;color:#c9d3e0}
.lang{display:flex;background:#1b2536;border-radius:9px;padding:3px}.lang button{background:none;border:0;color:#9aa4b1;font:inherit;font-size:13px;padding:5px 10px;border-radius:7px}.lang button[aria-pressed=true]{background:var(--accent);color:var(--ink)}
main{max-width:520px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h2{font-size:18px;margin:6px 0 0}
.faces{display:flex;justify-content:space-between;gap:4px}.faces button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:11px;color:var(--muted);flex:1;padding:4px 0;border-radius:10px}.faces button[aria-pressed=true]{background:#e6eef7}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 14px;font:inherit;font-size:15px;color:var(--ink)}.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
textarea,input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
label{font-size:14px;color:var(--muted)}
.send{background:var(--ink);color:var(--accent);border:0;border-radius:14px;padding:15px;font:600 17px "Geist",sans-serif}.send:disabled{opacity:.4}
.priv{font-size:12px;color:var(--muted);text-align:center}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:24px}.done h2{font-size:24px}
.steps{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}.steps li{padding:10px 12px 10px 34px;border-radius:10px;background:#e8edf3;position:relative;font-size:15px;color:var(--muted)}.steps li::before{content:"";position:absolute;left:13px;top:50%;width:10px;height:10px;margin-top:-6px;border-radius:50%;border:2px solid #9aa4b1}.steps li.on{background:#dff5ea;color:var(--ink)}.steps li.on::before{background:var(--good);border-color:var(--good)}
.err{color:var(--crit);font-size:14px;min-height:18px}
.pick{display:flex;flex-direction:column;gap:8px}.pick a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);text-decoration:none}.pick a span{display:block;font-size:13px;color:var(--muted)}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style></head><body>
<header><div><b>WCE Care</b><span id="where">West Coast Expressway</span></div><div class="lang" role="group" aria-label="Language"><button data-l="BM">BM</button><button data-l="EN">EN</button></div></header>
<main id="m"></main>
<script>
const RELAY="https://ntfy.sh", TOPIC="wceqraa315a3393eac9334921d037";
const QRS=[{"code":"TIN-WT","place":"R-TIN","name":"R&R Teluk Intan","area":"Women's toilets","topics":["Toilets","Cleanliness"]},{"code":"TIN-FC","place":"R-TIN","name":"R&R Teluk Intan","area":"Food court","topics":["Food & prices","Cleanliness"]},{"code":"BKR-L3","place":"P-Bukit Raja","name":"Bukit Raja toll plaza","area":"Lane 3","topics":["Charged wrongly","Queues","Tag & RFID","Staff"]},{"code":"SWG-EV","place":"R-SWG","name":"R&R Sungai Wangi","area":"EV charging bay","topics":["EV charging","Safety & lighting"]},{"code":"SNY-LP","place":"R-SNY","name":"R&R Sungai Nyior","area":"Lorry park","topics":["Parking","Safety & lighting","Toilets"]},{"code":"KM061-N","place":"S-1","name":"Bukit Raja–Assam Jawa","area":"Layby, KM 61 northbound","topics":["Potholes & surface","Lighting","Debris & safety"]}];
const T={BM:{how:"Bagaimana pengalaman anda?",bad:"Apa masalahnya?",good:"Apa yang anda suka?",more:"Ceritakan lagi (pilihan)",ph:"No. telefon untuk maklum balas (pilihan)",send:"Hantar",thanks:"Terima kasih!",ref:"No. rujukan",wa:"Kami akan maklumkan perkembangan melalui WhatsApp.",priv:"Maklumat anda dilindungi di bawah Akta Perlindungan Data Peribadi 2010.",faces:["Sangat teruk","Teruk","Biasa","Baik","Sangat baik"],pick:"Pilih lokasi anda",err:"Tidak dapat dihantar. Semak sambungan internet dan cuba lagi.",steps:["Diterima","Disalurkan kepada pasukan","Dibaiki","Anda dimaklumkan"]},
 EN:{how:"How was your experience?",bad:"What went wrong?",good:"What did you like?",more:"Tell us more (optional)",ph:"Phone number for updates (optional)",send:"Send",thanks:"Thank you!",ref:"Your reference",wa:"We'll send updates on WhatsApp.",priv:"Your details are protected under the Personal Data Protection Act 2010.",faces:["Very poor","Poor","OK","Good","Very good"],pick:"Choose your location",err:"Couldn't send. Check your internet connection and try again.",steps:["Received","Sent to the team","Fixed","You're told"]}};
const TBM={Toilets:"Tandas","Food & prices":"Makanan & harga",Cleanliness:"Kebersihan",Parking:"Tempat letak kenderaan",Surau:"Surau","EV charging":"Pengecas EV","Safety & lighting":"Keselamatan & lampu",Queues:"Barisan","Charged wrongly":"Caj tidak betul","Tag & RFID":"Tag & RFID",Staff:"Petugas","Potholes & surface":"Lubang & permukaan jalan",Lighting:"Lampu jalan",Roadworks:"Kerja jalan",Signage:"Papan tanda","Debris & safety":"Serpihan & keselamatan"};
let S={lang:"BM",rating:0,topic:"",text:"",phone:"",done:null,busy:false,err:""};
const q=()=>QRS.find(x=>x.code===decodeURIComponent(location.hash.slice(1)).toUpperCase());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const face=(i,on)=>{const c=["#d93b3b","#e5703a","#8a94a3","#4fae73","#1f9d5a"][i]; const m=["M9 17q3-3 6 0","M9 16.5q3-1.5 6 0","M9 16h6","M9 15.5q3 1.5 6 0","M8.5 15q3.5 3.5 7 0"][i]; return `<svg viewBox="0 0 24 24" width="46" height="46" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="${on?c:"none"}" stroke="${c}" stroke-width="1.6"/><circle cx="9" cy="10" r="1.1" fill="${on?"#fff":c}"/><circle cx="15" cy="10" r="1.1" fill="${on?"#fff":c}"/><path d="${m}" fill="none" stroke="${on?"#fff":c}" stroke-width="1.6" stroke-linecap="round"/></svg>`;};
function render(){ const L=T[S.lang], x=q(); document.documentElement.lang=S.lang==="BM"?"ms":"en"; document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang));
  const M=document.getElementById("m");
  if(!x){ document.getElementById("where").textContent="West Coast Expressway"; M.innerHTML=`<h2>${L.pick}</h2><div class="pick">${QRS.map(z=>`<a href="#${z.code}">${esc(z.name)}<span>${esc(z.area)}</span></a>`).join("")}</div>`; return; }
  document.getElementById("where").textContent=x.name+" · "+x.area;
  if(S.done){ M.innerHTML=`<div class="done"><svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#1f9d5a"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg><h2>${L.thanks}</h2><div>${L.ref}: <b>${esc(S.done)}</b></div><div style="color:var(--muted);font-size:14px">${S.phone?L.wa:""}</div><ol class="steps">${L.steps.map((s,i)=>`<li class="${i===0||(i===1&&S.rating<=3)?"on":""}">${s}</li>`).join("")}</ol></div>`; return; }
  M.innerHTML=`<h2>${L.how}</h2><div class="faces">${[0,1,2,3,4].map(i=>`<button data-r="${i+1}" aria-pressed="${S.rating===i+1}" aria-label="${L.faces[i]}">${face(i,S.rating===i+1)}<span>${L.faces[i]}</span></button>`).join("")}</div>
   ${S.rating?`<h2>${S.rating<=3?L.bad:L.good}</h2><div class="chips">${x.topics.map(t=>`<button data-t="${esc(t)}" aria-pressed="${S.topic===t}">${esc(S.lang==="BM"?(TBM[t]||t):t)}</button>`).join("")}</div>
   <label for="tx">${L.more}</label><textarea id="tx" maxlength="1000">${esc(S.text)}</textarea>
   <input id="ph" inputmode="tel" maxlength="30" placeholder="${L.ph}" value="${esc(S.phone)}" aria-label="${L.ph}">
   <button class="send" id="go" ${S.topic&&!S.busy?"":"disabled"}>${S.busy?"…":L.send}</button><div class="err" role="alert">${esc(S.err)}</div><div class="priv">${L.priv}</div>`:""}`;
  M.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.rating=+b.dataset.r; S.topic=""; render();});
  M.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{keep(); S.topic=b.dataset.t; render();});
  const g=document.getElementById("go"); if(g) g.onclick=send; }
function keep(){ const t=document.getElementById("tx"), p=document.getElementById("ph"); if(t) S.text=t.value; if(p) S.phone=p.value; }
async function send(){ keep(); const x=q(); S.busy=true; S.err=""; render();
  try{ const r=await fetch(`${RELAY}/${TOPIC}`,{method:"POST",body:JSON.stringify({t:"qr",code:x.code,place:x.place,area:x.area,topic:S.topic,rating:S.rating,text:S.text.trim().slice(0,1000),lang:S.lang,phone:S.phone.trim().slice(0,30)})});
    if(!r.ok) throw 0; const j=await r.json(); S.done="WCE-Q-"+String(j.id||Date.now()).slice(-5).toUpperCase(); }
  catch(e){ S.err=T[S.lang].err; }
  S.busy=false; render(); }
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{keep(); S.lang=b.dataset.l; render();});
addEventListener("hashchange",()=>{ S={...S,rating:0,topic:"",text:"",done:null,err:""}; render(); });
render();
</script></body></html>
